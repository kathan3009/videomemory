services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VIDEOMEMORY_HOSTED: "1"
      VIDEOMEMORY_DATA_ROOT: /data/videomemory
      VIDEOMEMORY_ALLOWED_HOSTS: localhost,localhost:8080
      VIDEOMEMORY_WEB_ORIGINS: http://localhost:3000
    volumes:
      - vm_data:/data/videomemory
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vm_data:
