services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      VIDEOMEMORY_HOSTED: "1"
      VIDEOMEMORY_DATA_ROOT: /data/videomemory
      VIDEOMEMORY_JOB_CONCURRENCY: "1"
      OMP_NUM_THREADS: "${VIDEOMEMORY_OMP_THREADS:-2}"
    volumes:
      - "${VIDEOMEMORY_HOST_DATA:-/opt/videomemory/data}:/data/videomemory"
    expose:
      - "8080"
    cpus: "${VIDEOMEMORY_CONTAINER_CPUS:-2.0}"
    mem_limit: "${VIDEOMEMORY_CONTAINER_MEMORY:-10g}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 180s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
